name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require scaffold
        shell: bash
        run: |
          if [[ ! -f package.json ]]; then
            echo "Windows packaging requires Phase 1+ scaffold (package.json)."
            echo "This workflow is prepared for later phases and will not publish artifacts yet."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Package Windows installer
        run: npm run dist:win
      - name: Upload artifacts (no auto GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            **/release/*.exe
            **/dist/*.exe
          if-no-files-found: warn

# NOTE: Publishing GitHub Releases is intentionally manual and requires approval.
# Do not add softprops/action-gh-release here until Phase 5 release process is active.
