name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify pnpm lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f pnpm-lock.yaml ]]; then
            echo "ERROR: pnpm-lock.yaml must exist at repository root."
            exit 1
          fi
          if [[ ! -f package.json ]]; then
            echo "Windows packaging requires package.json."
            exit 1
          fi
          echo "pnpm-lock.yaml found."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack and activate pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Setup Node.js pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch development qpdf (Windows)
        run: pnpm fetch:qpdf

      - name: Build application
        run: pnpm build

      - name: Package Windows installer
        run: pnpm --filter @cm-flow-manager/desktop dist:win

      - name: Write release checksums
        run: pnpm release:checksums

      - name: Upload artifacts (no auto GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            release/*.yml
          if-no-files-found: warn

# NOTE: Publishing GitHub Releases is intentionally manual and requires approval.
# Do not add softprops/action-gh-release here until the release process is active.
