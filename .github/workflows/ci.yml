name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-guard:
    name: Phase documentation guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required documents exist
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            CHANGELOG.md
            ROADMAP.md
            CONTRIBUTING.md
            SECURITY.md
            LICENSE
            docs/PROJECT_VISION.md
            docs/PRODUCT_REQUIREMENTS.md
            docs/ARCHITECTURE.md
            docs/TECH_STACK.md
            docs/MODULE_SYSTEM.md
            docs/PDF_ENGINE_EVALUATION.md
            docs/SECURITY_MODEL.md
            docs/TESTING_STRATEGY.md
            docs/RELEASE_PROCESS.md
            docs/DEVELOPMENT_WORKFLOW.md
            docs/LOCALIZATION.md
            docs/DECISIONS.md
            docs/STATE_REGISTRY.md
            docs/KNOWN_LIMITATIONS.md
            docs/PROJECT_STATUS.md
            docs/UI_DIRECTION.md
            docs/adr/ADR-001-desktop-stack.md
            docs/adr/ADR-002-project-structure.md
            docs/adr/ADR-003-pdf-engine.md
            docs/adr/ADR-004-electron-security.md
            docs/adr/ADR-005-local-only-processing.md
            docs/adr/ADR-006-git-workflow.md
            package.json
            pnpm-workspace.yaml
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "MISSING: $f"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

  validate:
    name: Typecheck, lint, test, build
    runs-on: windows-latest
    needs: docs-guard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
