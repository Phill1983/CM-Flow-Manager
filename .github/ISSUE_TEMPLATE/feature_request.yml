name: Feature request
description: Propose a change within product roadmap discipline
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Features outside the approved phase may be deferred. Password cracking / bypass will be rejected.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Earliest sensible phase
      options:
        - Phase 1 — shell
        - Phase 2 — PDF engine
        - Phase 3 — single-file UI
        - Phase 4 — batch robustness
        - Phase 5 — packaging
        - After v0.1.0
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints acknowledged
      options:
        - label: This does not require password cracking or cloud processing of documents.
          required: true
